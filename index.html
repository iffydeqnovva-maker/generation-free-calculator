<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Текуща квалификация</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 24px;
  background: white;
  color: #222;
}

.card {
  max-width: 620px;
  margin: auto;
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 20px;
}

h2 {
  margin-top: 0;
}

p {
  color: #666;
}

label {
  display: block;
  border: 2px dashed #ddd;
  border-radius: 14px;
  padding: 30px 16px;
  text-align: center;
  cursor: pointer;
}

input {
  display: none;
}

.icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.status {
  margin-top: 16px;
  color: #666;
}

.result {
  margin-top: 18px;
  background: #f5f5f5;
  border-radius: 12px;
  padding: 18px;
}

.amount {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

button {
  margin-top: 14px;
  padding: 10px 16px;
  border: 0;
  border-radius: 999px;
  background: #222;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="card">
  <h2>Текуща квалификация</h2>
  <p>Качи своята справка за активност</p>

  <label for="file">
    <div class="icon">📊</div>
    <strong>Избери Excel файл</strong>
    <p>.xlsx или .xls · обработка само в браузъра</p>
  </label>

  <input id="file" type="file" accept=".xlsx,.xls">

  <div id="status" class="status">Очаква се файл…</div>

  <div class="result">
    <div>Общо „английско U“</div>
    <div id="amount" class="amount">—</div>
    <p>Сумира се директно Excel колона U: „Продажби по каталожна цена“.</p>
  </div>

  <button id="reset" type="button">Изчисти</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const fileInput = document.getElementById("file");
const statusEl = document.getElementById("status");
const amountEl = document.getElementById("amount");
const resetBtn = document.getElementById("reset");

function parseNumber(value) {
  if (typeof value === "number" && Number.isFinite(value)) {
    return value;
  }

  if (typeof value !== "string") {
    return 0;
  }

  let text = value
    .trim()
    .replace(/\s/g, "")
    .replace(",", ".")
    .replace(/[^\d.-]/g, "");

  const number = Number(text);

  return Number.isFinite(number) ? number : 0;
}

fileInput.addEventListener("change", async function () {
  const file = fileInput.files[0];

  if (!file) {
    return;
  }

  try {
    statusEl.textContent = "Обработване…";

    const buffer = await file.arrayBuffer();

    const workbook = XLSX.read(buffer, {
      type: "array",
      cellDates: false
    });

    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

    const rows = XLSX.utils.sheet_to_json(firstSheet, {
      header: 1,
      defval: ""
    });

    let total = 0;

    for (let rowIndex = 1; rowIndex < rows.length; rowIndex++) {
      const value = rows[rowIndex][20];
      total += parseNumber(value);
    }

    amountEl.textContent = total.toLocaleString("bg-BG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    statusEl.textContent = "Успешно обработване.";
  } catch (error) {
    console.error(error);
    statusEl.textContent =
      "Неуспешно обработване. Провери дали файлът е Excel .xlsx или .xls.";
    amountEl.textContent = "—";
  }
});

resetBtn.addEventListener("click", function () {
  fileInput.value = "";
  statusEl.textContent = "Очаква се файл…";
  amountEl.textContent = "—";
});
</script>
</body>
</html>
